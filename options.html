<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>翻譯設置</title>
  <style>
    body { margin: 0; padding: 24px; font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; color: #222; background: #f7f8fa; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px 22px; max-width: 860px; margin-bottom: 16px; }
    label { display: inline-block; min-width: 130px; color: #374151; }
    input[type=text], input[type=password], input[type=number], select { padding: 5px 8px; border: 1px solid #d0d4dc; border-radius: 6px; width: 260px; }
    .row { margin: 8px 0; }
    .tip { font-size: 12px; color: #8a8f99; margin-left: 136px; }
    button { padding: 5px 14px; border: 1px solid #d0d4dc; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    button:hover { filter: brightness(0.97); }
    .status { font-size: 12px; margin-left: 10px; }
    .status.ok { color: #16a34a; }
    .status.err { color: #c0392b; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #e5e7eb; padding: 6px 10px; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; }
    .fav { color: #f59e0b; cursor: pointer; }
    .del { color: #c0392b; cursor: pointer; }
    .search { width: 200px; }
    .provider { border: 1px dashed #d0d4dc; border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
    .provider h3 { margin: 0 0 8px; font-size: 14px; }
    .ord-badge { display: inline-block; min-width: 18px; text-align: center; background: #2563eb; color: #fff; border-radius: 9px; font-size: 11px; padding: 1px 5px; margin-right: 8px; }
    .ord-btns { float: right; }
    .ord-btns button { padding: 1px 8px; font-size: 12px; margin-left: 4px; }
  </style>
</head>
<body>
  <h1>TransHub - 設置</h1>

  <div class="panel">
    <h2>基本設置</h2>
    <div class="row"><label>啟用翻譯</label><input type="checkbox" id="enabled"></div>
    <div class="row"><label>來源語言</label>
      <select id="sourceLang">
        <option value="auto">自動檢測</option>
        <option value="en">英語</option>
        <option value="ja">日語</option>
        <option value="ko">韓語</option>
      </select>
    </div>
    <div class="row"><label>目標語言</label>
      <select id="targetLang">
        <option value="zh-TW">繁體中文</option>
        <option value="zh">簡體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>
    <div class="row"><label><input type="checkbox" id="hotkey-enabled"> 啟用快速鍵（選中文字後連按兩次翻譯）</label></div>
    <div class="row"><label>快速鍵</label><input type="text" id="hotkey-key" maxlength="1" style="width:60px"><span class="tip">單個字母或數字，默認 t，輸入框內不會觸發</span></div>
    <div class="row"><button class="primary" id="saveBasic">保存基本設置</button><span class="status" id="basicStatus"></span></div>
  </div>

  <div class="panel">
    <h2>用量總覽 <button id="refreshUsage" style="margin-left:10px">刷新</button></h2>
    <table id="usageTable">
      <thead><tr><th>服務</th><th>狀態</th><th>本月剩餘 / 上限（字符）</th><th>本月已調用</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>翻譯服務</h2>
    <p class="tip" style="margin-left:0">按下方順序嘗試翻譯，額度用盡自動切換下一個，全部用盡則停止，不會自動付費。使用「上移 / 下移」調整順序，立即生效。</p>
    <div id="providerList">
      <div class="provider" data-pid="tencent">
        <h3 data-name="騰訊雲機器翻譯">騰訊雲機器翻譯</h3>
        <div class="row"><label><input type="checkbox" id="tencent-enabled"> 啟用</label></div>
        <div class="row"><label>SecretId</label><input type="password" id="tencent-secretId" autocomplete="off"></div>
        <div class="row"><label>SecretKey</label><input type="password" id="tencent-secretKey" autocomplete="off"></div>
        <div class="row"><button data-test="tencent">測試</button><span class="status" id="tencent-status"></span></div>
      </div>

      <div class="provider" data-pid="alibaba">
        <h3 data-name="阿里雲機器翻譯">阿里雲機器翻譯</h3>
        <div class="row"><label><input type="checkbox" id="alibaba-enabled"> 啟用</label></div>
        <div class="row"><label>AccessKeyId</label><input type="password" id="alibaba-accessKeyId" autocomplete="off"></div>
        <div class="row"><label>AccessKeySecret</label><input type="password" id="alibaba-accessKeySecret" autocomplete="off"></div>
        <div class="row"><button data-test="alibaba">測試</button><span class="status" id="alibaba-status"></span></div>
      </div>

      <div class="provider" data-pid="baidu">
        <h3 data-name="百度翻譯">百度翻譯</h3>
        <div class="row"><label><input type="checkbox" id="baidu-enabled"> 啟用</label></div>
        <div class="row"><label>APPID</label><input type="password" id="baidu-appid" autocomplete="off"></div>
        <div class="row"><label>密鑰</label><input type="password" id="baidu-key" autocomplete="off"></div>
        <div class="row"><button data-test="baidu">測試</button><span class="status" id="baidu-status"></span></div>
      </div>

      <div class="provider" data-pid="youdao">
        <h3 data-name="有道翻譯">有道翻譯</h3>
        <div class="row"><label><input type="checkbox" id="youdao-enabled"> 啟用</label></div>
        <div class="row"><label>AppKey</label><input type="password" id="youdao-appKey" autocomplete="off"></div>
        <div class="row"><label>AppSecret</label><input type="password" id="youdao-appSecret" autocomplete="off"></div>
        <div class="row"><button data-test="youdao">測試</button><span class="status" id="youdao-status"></span></div>
      </div>
    </div>

    <div class="row" style="margin-top:16px"><button class="primary" id="saveProviders">保存服務設置</button><span class="status" id="providerStatus"></span></div>
  </div>

  <div class="panel">
    <h2>翻譯歷史</h2>
    <div class="row">
      <input type="text" class="search" id="search" placeholder="搜索歷史…">
      <button id="exportHistory">導出 JSON</button>
      <button id="clearHistory">清空歷史</button>
    </div>
    <table id="historyTable">
      <thead><tr><th style="width:24px"></th><th>原文</th><th>譯文</th><th>服務</th><th>時間</th><th style="width:60px"></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="options.js"></script>
</body>
</html>
